<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音樂名詞診斷 Prototype v3</title>
<style>
:root{--bg:#f6f4fa;--card:#fff;--text:#251f2d;--muted:#756d7d;--line:#e6e0ea;--accent:#6b4fa3;--soft:#efeafa;--good:#2f7d55;--warn:#a9772b;--bad:#ad4c4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65}.wrap{max-width:860px;margin:auto;padding:16px 14px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:var(--accent);font-weight:800;text-decoration:none}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:900;color:var(--accent)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.tab.active{background:var(--accent);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 26px rgba(62,42,88,.06)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--soft);color:#594274;border-radius:999px;padding:6px 10px;font-size:13px}.term{font-size:34px;line-height:1.2;margin:12px 0 4px}.muted{color:var(--muted)}.q{font-weight:900;margin:20px 0 8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:850;font-size:15px;cursor:pointer}.choice,.secondary{background:#f1eef4;color:var(--text)}.choice.active{outline:3px solid #cdbde7;background:#eee7f8}.primary{width:100%;margin-top:12px;background:var(--accent);color:#fff}.secondary{width:100%;margin-top:10px}.input,textarea{width:100%;border:1px solid #d8d0df;border-radius:13px;padding:12px;font-size:16px;background:#fff;color:var(--text)}textarea{min-height:140px;resize:vertical}.hidden{display:none}.answer{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}.diag{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0}.box{padding:12px;border:1px solid var(--line);border-radius:14px;background:#faf8fb}.box b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}.hit{background:#eef7f1}.miss{background:#fff3f1}.hit b{color:var(--good)}.miss b{color:var(--bad)}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scorebox{text-align:center;border:1px solid var(--line);border-radius:15px;padding:13px;background:#f8f6fa}.scorebox strong{display:block;font-size:24px}.teacher,.confuse{margin-top:14px;padding:15px;border-radius:16px}.teacher{background:#fbf8ef;border:1px solid #ece1c2}.confuse{background:#f2f7fb;border:1px solid #dce9f2}.confuse button{display:block;width:100%;margin-top:8px}.review{margin-top:12px;padding:13px;border-radius:14px;background:#eef6f0}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}@media(max-width:620px){.choices,.diag,.scoregrid{grid-template-columns:1fr}.term{font-size:29px}.card{padding:17px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="eyebrow">TEST VERSION 3</div><b>音樂名詞｜診斷你到底缺哪一塊</b></div><a href="./">← 原網站</a></div>
<div class="tabs"><button class="tab active" data-panel="learn">學習診斷</button><button class="tab" data-panel="review">到期複習 <span id="dueCount">0</span></button><button class="tab" data-panel="stats">熟練紀錄</button></div>
<section id="learnPanel"><article class="card">
<div class="chips"><span id="topic" class="chip"></span><span id="counter" class="chip"></span><span id="state" class="chip">尚未作答</span></div>
<div class="eyebrow">STEP 1｜只看原文</div><h1 id="term" class="term"></h1><p class="muted">不給中文、不給選項。先測你能不能主動提取。</p>
<div class="q">① 第一眼熟悉度</div><div class="choices" id="confidence"><button class="btn choice" data-v="2">🟢 我知道</button><button class="btn choice" data-v="1">🟡 有印象</button><button class="btn choice" data-v="0">🔴 完全不知道</button></div>
<div class="q">② 中文名稱</div><input id="zhInput" class="input" placeholder="請自己輸入">
<div class="q">③ 教甄名詞解釋</div><textarea id="explainInput" placeholder="請用考場會寫的方式回答。可想：是什麼？何時？哪裡？誰？為什麼？如何？代表作品？"></textarea>
<button id="revealBtn" class="btn primary">🔍 完成作答，開始診斷</button>
<section id="answer" class="answer hidden">
<div class="eyebrow">STEP 2｜系統初步診斷</div><h2 id="zh"></h2><p id="definition"></p>
<div id="diagnosis" class="diag"></div>
<div class="review"><b>📌 診斷結果</b><div id="advice"></div></div>
<h3>🎯 教甄完整答題重點</h3><p id="exam"></p>
<h3>🧭 人事時地物 × 音樂版 5W</h3><div id="fivew" class="diag"></div>
<div class="teacher"><b>👩‍🏫 如果我是老師，我可以怎麼教？</b><div id="teacher"></div><div class="q">30 秒教師挑戰</div><textarea id="teachInput" placeholder="請用學生聽得懂的方式說明，或寫一個小活動。"></textarea></div>
<div class="confuse"><b>⚔️ 相似名詞辨析</b><p id="confuseQ"></p><div id="confuseBtns"></div><p id="confuseFeedback" class="muted"></p></div>
<div class="scoregrid"><div class="scorebox">🧠 辨識力<strong id="recognition">0</strong><small>/100</small></div><div class="scorebox">✍️ 表達力<strong id="expression">0</strong><small>/100</small></div><div class="scorebox">👩‍🏫 教學力<strong id="teaching">—</strong><small>完成教師挑戰後更新</small></div></div>
<button id="saveBtn" class="btn primary">💾 儲存本次學習</button><button id="nextBtn" class="btn secondary">下一題 →</button>
</section></article></section>
<section id="reviewPanel" class="hidden"><article class="card"><h2>到期複習</h2><div id="reviewList"></div></article></section>
<section id="statsPanel" class="hidden"><article class="card"><h2>熟練紀錄</h2><div id="statsList"></div></article></section>
</div>
<script>
const TERMS=[
{id:'prepared',term:'Prepared Piano',zh:['預置鋼琴','加料鋼琴'],topic:'20世紀音樂',definition:'在鋼琴琴弦之間或琴弦上放置螺絲、橡皮、金屬等物件，改變原本音色與共鳴。',exam:'20世紀實驗音樂的重要技法，與 John Cage 密切相關。可寫出在琴弦間放置異物改變音色，並舉 Sonatas and Interludes 為代表作品。',dims:[['🎵 What｜是什麼',['預置','鋼琴','琴弦','音色']],['🕰️ When｜何時',['20世紀','1940']],['🌍 Where｜何地',['美國']],['👤 Who｜誰',['John Cage','Cage','凱吉','凱基']],['🛠️ How｜如何',['螺絲','橡皮','金屬','琴弦','放置']],['🎼 Works｜作品',['Sonatas and Interludes','奏鳴曲與間奏曲']]],teacher:['先比較一般鋼琴與預置鋼琴的聲音。','看琴內加料的照片，猜材質如何改變音色。','最後用「人物＋作法＋聲響＋作品」寫成名詞解釋。'],confuse:{q:'Prepared Piano 最容易和哪一概念混淆？',choices:['特殊調弦 Scordatura','機遇音樂 Aleatory Music','多調性 Polytonality'],a:0,why:'Prepared Piano 是改變鋼琴發聲條件；Scordatura 則是改變弦樂器標準定弦。兩者都在改變原本聲響條件，但方法不同。'}},
{id:'cori',term:'Cori Spezzati',zh:['分置合唱','分置合唱團'],topic:'文藝復興音樂',definition:'將兩組或多組合唱團分置於不同空間位置，以交替、呼應或合唱形成空間性的複合聲響。',exam:'應寫出文藝復興晚期威尼斯樂派、聖馬可大教堂、多合唱團空間分置，以及 Andrea／Giovanni Gabrieli。',dims:[['🎵 What｜是什麼',['合唱團','分置','呼應','空間']],['🕰️ When｜何時',['文藝復興','巴洛克']],['🌍 Where｜何地',['威尼斯','聖馬可']],['👤 Who｜誰',['Gabrieli','加布里埃利']],['💡 Why｜為何',['建築','唱經樓','空間']],['🎼 Works｜作品',['Sacrae symphoniae','神聖交響曲']]],teacher:['先看聖馬可大教堂空間，再聽多合唱對答。','全班分成兩組站不同位置，以節奏或短旋律互答。','最後討論：建築空間會不會影響作曲方法？'],confuse:{q:'Cori Spezzati 的核心不是哪一項？',choices:['多組合唱團空間分置','威尼斯與聖馬可大教堂','單一旋律所有聲部完全同奏'],a:2,why:'它的特色在空間分置與對答，不是單純所有聲部同奏。'}},
{id:'hex',term:'Hexachord',zh:['六音音列','六音階系統'],topic:'中世紀與樂理',definition:'中世紀視唱理論中以 ut–re–mi–fa–sol–la 六音系統組織音高與視唱。',exam:'應寫出六個唱名、Guido of Arezzo、solmization，以及 natural／hard／soft hexachord。',dims:[['🎵 What｜是什麼',['六音','ut','re','mi','fa','sol','la']],['🕰️ When｜何時',['中世紀']],['👤 Who｜誰',['Guido','Arezzo','圭多']],['🛠️ How｜如何',['solmization','唱名','視唱']],['🔗 類型',['natural','hard','soft']],['🔗 Related｜相關',['Guidonian hand','mutation']]],teacher:['直接唱 ut–re–mi–fa–sol–la。','搭配 Guidonian hand 圖像。','把 natural／hard／soft 做成分類卡遊戲。'],confuse:{q:'Hexachord 與現代七聲音階最大的不同是？',choices:['核心以六個唱名組織','一定是十二平均律','只能用在器樂'],a:0,why:'Hexachord 的核心是六音與中世紀 solmization 系統。'}},
{id:'poly',term:'Polytonality',zh:['多調性'],topic:'20世紀音樂',definition:'同一時間並置兩個或以上可辨識的調性中心；兩個調性並置常稱 bitonality。',exam:'重點要寫「同時存在多個可辨識調性中心」，並與 atonality 無調性區別。',dims:[['🎵 What｜是什麼',['調性中心','多個','同時','並置']],['🕰️ When｜何時',['20世紀']],['🛠️ How｜如何',['聲部','不同調性','並置']],['⚠️ Compare｜比較',['bitonality','雙調性']],['⚠️ 不要混淆',['無調性','atonality']],['💡 Why｜為何',['擴張','和聲','調性']]],teacher:['先播放單一調性，再播放不同調性層疊片段。','讓兩組學生同時唱不同調的短旋律。','問：有衝突感就一定是無調性嗎？'],confuse:{q:'Polytonality 與 Atonality 的關鍵差異是？',choices:['多調性仍有可辨識調性中心','多調性完全沒有調性中心','兩者完全相同'],a:0,why:'多調性是多個調性中心同時存在；無調性則避免建立傳統調性中心。'}},
{id:'mystic',term:'Mystic Chord',zh:['神祕和弦'],topic:'20世紀音樂',definition:'與 Alexander Scriabin 密切相關的六音和弦集合，常以四度與增四度關係描述其特殊和聲色彩。',exam:'應連結 Scriabin 與 Prometheus；可補充其六音結構及四度堆疊特色。',dims:[['🎵 What｜是什麼',['六音','和弦']],['🕰️ When｜何時',['20世紀']],['👤 Who｜誰',['Scriabin','史克里亞賓']],['🛠️ How｜結構',['四度','增四度']],['🎼 Works｜作品',['Prometheus','普羅米修斯']],['💡 Why｜特色',['和聲色彩','神祕']]],teacher:['先聽和弦色彩，再猜它不像傳統三和弦的原因。','把六個音做成音卡，觀察音程關係。','最後用「人物＋結構＋作品」寫成名詞解釋。'],confuse:{q:'Mystic Chord 最直接應連結哪位作曲家？',choices:['Scriabin','Debussy','Bartók'],a:0,why:'Mystic Chord 是 Scriabin 最具代表性的和聲語彙之一。'}}
];
const KEY='termProtoV3';let idx=0,confidence=null,currentDiag=null,confuseOK=false;
const $=id=>document.getElementById(id);const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'');
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function render(){const t=TERMS[idx];$('topic').textContent=t.topic;$('counter').textContent=`${idx+1}/${TERMS.length}`;$('term').textContent=t.term;$('state').textContent='尚未作答';$('zhInput').value='';$('explainInput').value='';$('teachInput').value='';$('answer').classList.add('hidden');confidence=null;confuseOK=false;document.querySelectorAll('#confidence .choice').forEach(b=>b.classList.remove('active'))}
function diagnosis(t,text){return t.dims.map(([label,keys])=>{const hits=keys.filter(k=>norm(text).includes(norm(k)));return{label,hit:hits.length>0,found:hits}})}
function reveal(){const t=TERMS[idx],zh=norm($('zhInput').value),essay=$('explainInput').value;const zhOK=t.zh.some(z=>zh.includes(norm(z))||norm(z).includes(zh)&&zh.length>=2);currentDiag=diagnosis(t,essay);$('zh').textContent=`${t.zh.join('／')} ${zhOK?'✅':'⚠️'}`;$('definition').textContent=t.definition;$('diagnosis').innerHTML=currentDiag.map(d=>`<div class="box ${d.hit?'hit':'miss'}"><b>${d.hit?'✅':'缺漏'} ${d.label}</b>${d.hit?`有抓到：${d.found.join('、')}`:'這一塊目前沒有明顯關鍵詞'}</div>`).join('');const missing=currentDiag.filter(d=>!d.hit).map(d=>d.label.split('｜')[0]).join('、');const hitCount=currentDiag.filter(d=>d.hit).length;const exp=Math.round(hitCount/currentDiag.length*100);$('advice').innerHTML=missing?`你目前有寫到 ${hitCount}/${currentDiag.length} 個面向。下一輪優先補：<b>${missing}</b>。`:`六個面向都有抓到，可以進入延遲回想。`;$('exam').textContent=t.exam;$('fivew').innerHTML=t.dims.map(([label,keys])=>`<div class="box"><b>${label}</b>${keys.join('、')}</div>`).join('');$('teacher').innerHTML=t.teacher.map(x=>`<p>${x}</p>`).join('');$('confuseQ').textContent=t.confuse.q;$('confuseBtns').innerHTML=t.confuse.choices.map((c,i)=>`<button class="btn secondary confuseChoice" data-i="${i}">${c}</button>`).join('');document.querySelectorAll('.confuseChoice').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.i)===t.confuse.a;confuseOK=ok;$('confuseFeedback').textContent=(ok?'✅ ':'❌ ')+t.confuse.why;});$('recognition').textContent=zhOK?(confidence===2?100:80):(confidence===0?20:40);$('expression').textContent=exp;$('teaching').textContent='—';$('answer').classList.remove('hidden');$('state').textContent=exp>=80&&zhOK?'接近熟練':'仍需補強'}
function saveProgress(){const t=TERMS[idx],db=load();if(!currentDiag)return;const zhOK=t.zh.some(z=>norm($('zhInput').value).includes(norm(z))||norm(z).includes(norm($('zhInput').value))&&$('zhInput').value.length>=2);const exp=Math.round(currentDiag.filter(d=>d.hit).length/currentDiag.length*100);const teach=$('teachInput').value.trim();const teaching=teach.length>=18?100:teach.length>=8?70:30;$('teaching').textContent=teaching;const rec=zhOK?(confidence===2?100:80):(confidence===0?20:40);const mastery=Math.round(rec*.35+exp*.45+teaching*.15+(confuseOK?100:30)*.05);const days=mastery>=85?7:mastery>=65?3:1;const next=new Date(Date.now()+days*86400000);db[t.id]={term:t.term,rec,exp,teaching,mastery,next:next.toISOString().slice(0,10),updated:new Date().toISOString()};save(db);$('state').textContent=mastery>=85?'🟢 熟練中':mastery>=65?'🟡 理解中':'🔴 待補強';renderLists();alert(`已儲存：總掌握 ${mastery}%｜${days} 天後複習`)}
function renderLists(){const db=load(),today=new Date().toISOString().slice(0,10),rows=TERMS.map(t=>db[t.id]).filter(Boolean),due=rows.filter(r=>r.next<=today);$('dueCount').textContent=due.length;$('reviewList').innerHTML=due.length?due.map(r=>`<div class="listrow"><b>${r.term}</b><br><span class="bad">已到複習日</span>｜掌握 ${r.mastery}%</div>`).join(''):'<p class="muted">目前沒有到期名詞。</p>';$('statsList').innerHTML=rows.length?rows.sort((a,b)=>a.mastery-b.mastery).map(r=>`<div class="listrow"><b>${r.term}</b><br>🧠 ${r.rec}%｜✍️ ${r.exp}%｜👩‍🏫 ${r.teaching}%｜總掌握 ${r.mastery}%<br><span class="muted">下次複習：${r.next}</span></div>`).join(''):'<p class="muted">還沒有學習紀錄。</p>'}
document.querySelectorAll('#confidence .choice').forEach(b=>b.onclick=()=>{confidence=Number(b.dataset.v);document.querySelectorAll('#confidence .choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('revealBtn').onclick=reveal;$('saveBtn').onclick=saveProgress;$('nextBtn').onclick=()=>{idx=(idx+1)%TERMS.length;render()};document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');['learn','review','stats'].forEach(p=>$(p+'Panel').classList.toggle('hidden',p!==tab.dataset.panel));renderLists()});render();renderLists();
</script></body></html>
