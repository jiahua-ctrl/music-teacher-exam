<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>題庫品管中心｜中等音樂教甄上岸</title><link rel="stylesheet" href="style.css"><style>.qc{max-width:1000px;margin:auto;padding:24px 16px 50px}.qc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qc-stat{padding:18px}.qc-list{display:grid;gap:10px}.qc-row{padding:14px;border:1px solid var(--line);border-radius:12px}.qc-badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.qc-row a{word-break:break-all}@media(max-width:700px){.qc-grid{grid-template-columns:1fr}}</style></head><body><main class="qc"><a class="ghost small" href="index.html">← 回首頁</a><section class="card section-card" style="margin-top:14px"><span class="eyebrow">Evidence first</span><h1>題庫品管／驗證中心</h1><p class="muted">不要求你相信 AI；每題都要能追溯。🟢＝有官方題卷／答案可直接核對；🟡＝考點或答案經可靠來源交叉核對；🔴＝尚待人工核對，建議先不要當作定論。</p><div class="qc-grid"><div class="card qc-stat"><b>🟢 官方已核對</b><div id="qGreen" class="score-big">0</div></div><div class="card qc-stat"><b>🟡 交叉核對</b><div id="qYellow" class="score-big">0</div></div><div class="card qc-stat"><b>🔴 待人工核對</b><div id="qRed" class="score-big">0</div></div></div></section><section class="card section-card"><h2>優先稽核清單</h2><p class="muted">先處理官方考點改寫與容易有細節爭議的題目；點來源可回原公告。</p><div id="qcList" class="qc-list"></div></section></main><script src="questions.js"></script><script src="questions_recent.js"></script><script src="questions_official_111_115.js"></script><script src="quality_center.js"></script></body></html>
